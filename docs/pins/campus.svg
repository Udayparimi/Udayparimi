<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 77" width="882" height="77" role="img"><title>Campus events</title><desc>Student registration and admin tools. React · Express · JWT. Open Campus-event-management.</desc><defs><linearGradient id="base" x2="1" y2="1"><stop offset="0.00" stop-color="#182736"/><stop offset="0.50" stop-color="#131e30"/><stop offset="1.00" stop-color="#121a2a"/></linearGradient><linearGradient id="edge" x2="0" y2="1"><stop offset="0.00" stop-color="#8ca4b3"/><stop offset="0.50" stop-color="#34485c"/><stop offset="1.00" stop-color="#172638"/></linearGradient><linearGradient id="alloy" x2="0" y2="1"><stop offset="0.00" stop-color="#edf5f3"/><stop offset="0.33" stop-color="#819eae"/><stop offset="0.67" stop-color="#44566f"/><stop offset="1.00" stop-color="#93a3ba"/></linearGradient><linearGradient id="tint" x2="1" y2="1"><stop offset="0.00" stop-color="#ffbd86"/><stop offset="1.00" stop-color="#a6efc0"/></linearGradient><linearGradient id="ivory" x2="0" y2="1"><stop offset="0.00" stop-color="#fff4d7"/><stop offset="0.50" stop-color="#e5cda2"/><stop offset="1.00" stop-color="#afb0a5"/></linearGradient><radialGradient id="halo"><stop stop-color="#ffbd86" stop-opacity=".25"/><stop offset="1" stop-color="#ffbd86" stop-opacity="0"/></radialGradient><clipPath id="tape"><path d="M39 21l52 5-1 29-52-5z"/></clipPath></defs><style>@media (prefers-reduced-motion:no-preference){
