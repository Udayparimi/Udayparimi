<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 77" width="882" height="77" role="img"><title>Student project tracker</title><desc>Track projects from proposal to completion. React · Express · MongoDB. Open FSD-CIA-3.</desc><defs><linearGradient id="base" x2="1" y2="1"><stop offset="0.00" stop-color="#182736"/><stop offset="0.50" stop-color="#131e30"/><stop offset="1.00" stop-color="#121a2a"/></linearGradient><linearGradient id="edge" x2="0" y2="1"><stop offset="0.00" stop-color="#8ca4b3"/><stop offset="0.50" stop-color="#34485c"/><stop offset="1.00" stop-color="#172638"/></linearGradient><linearGradient id="alloy" x2="0" y2="1"><stop offset="0.00" stop-color="#edf5f3"/><stop offset="0.33" stop-color="#819eae"/><stop offset="0.67" stop-color="#44566f"/><stop offset="1.00" stop-color="#93a3ba"/></linearGradient><linearGradient id="tint" x2="1" y2="1"><stop offset="0.00" stop-color="#f7a9cd"/><stop offset="1.00" stop-color="#b4b4ff"/></linearGradient><linearGradient id="ivory" x2="0" y2="1"><stop offset="0.00" stop-color="#fff4d7"/><stop offset="0.50" stop-color="#e5cda2"/><stop offset="1.00" stop-color="#afb0a5"/></linearGradient><radialGradient id="halo"><stop stop-color="#f7a9cd" stop-opacity=".25"/><stop offset="1" stop-color="#f7a9cd" stop-opacity="0"/></radialGradient><clipPath id="tape"><path d="M39 21l52 5-1 29-52-5z"/></clipPath></defs><style>@media (prefers-reduced-motion:no-preference){
    .signal{animation:signal 6.4s linear infinite}.rotor{transform-box:fill-box;transform-origin:center;animation:rotate 8s linear infinite}
    .plot{animation:plot 5.4s ease-in-out infinite}.ticket{animation:ticket 6s ease-in-out infinite}.beam{animation:beam 6s ease-in-out infinite}
    .carriage{animation:carriage 6.6s cubic-bezier(.45,0,.2,1) infinite}.paper{animation:paper 6s ease-in-out infinite}
    .indexlit{animation:indexlit 7s ease-in-out infinite;animation-delay:var(--d,0s)}}
    @keyframes signal{0%,10%{stroke-dashoffset:65;opacity:0}18%,68%{opacity:1}76%,100%{stroke-dashoffset:-42;opacity:0}}
