    @keyframes ticket{0%,15%,100%{transform:translate(-4px,2px)}45%,70%{transform:translate(7px,-3px)}}
    @keyframes beam{0%,28%,78%,100%{opacity:.18}39%,65%{opacity:.92}}
    @keyframes carriage{0%,10%,100%{transform:translate(0,0)}34%,46%{transform:translate(16px,-4px)}64%,78%{transform:translate(33px,-9px)}}
    @keyframes paper{0%,12%,100%{transform:translate(0,-3px)}46%,72%{transform:translate(0,5px)}}
    @keyframes indexlit{0%,65%,100%{opacity:.58}16%,35%{opacity:1}}
