name: Update profile contribution graphics
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-contributions.yml
      - .github/scripts/render_activity.py
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'

permissions:
  contents: write

concurrency:
  group: profile-contribution-output
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            generated-profile/snake-light.svg
            generated-profile/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build isometric contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Draw contribution activity from GitHub data
        run: python3 .github/scripts/render_activity.py generated-profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect output
        run: |
          set -eu
          cp profile-3d-contrib/profile-green.svg generated-profile/calendar-light.svg
          cp profile-3d-contrib/profile-night-rainbow.svg generated-profile/calendar-dark.svg
          for asset in snake-light snake-dark calendar-light calendar-dark activity activity-mobile; do
            test -s "generated-profile/$asset.svg"
          done
          test -s generated-profile/activity-summary.md
      - name: Publish generated graphics to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./generated-profile
          enable_jekyll: false
