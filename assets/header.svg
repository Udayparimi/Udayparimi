<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="290" viewBox="0 0 1040 290" role="img" aria-labelledby="title desc">
<title id="title">Udaya Raghavendra</title>
<desc id="desc">Aspiring data analyst, MERN developer, and machine learning learner. Gradient wireframe contours and a rotating role label.</desc>
<defs>
  <linearGradient id="accent"><stop stop-color="#5ceaff"/><stop offset="1" stop-color="#ad8bff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#271d59"/><stop offset="1" stop-color="#090f22"/></radialGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0v26" fill="none" stroke="#243151" stroke-width="1"/></pattern>
</defs>
<style>
.role-a{animation:a 9s infinite}.role-b{opacity:0;animation:b 9s infinite}.role-c{opacity:0;animation:c 9s infinite}.trace{animation:trace 10s linear infinite}
@keyframes a{0%,29%,100%{opacity:1}33%,96%{opacity:0}}
@keyframes b{0%,29%,67%,100%{opacity:0}33%,62%{opacity:1}}
@keyframes c{0%,62%,100%{opacity:0}67%,96%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-72}}
@media(prefers-reduced-motion:reduce){.role-a,.role-b,.role-c,.trace{animation:none}}
</style>
<rect width="1040" height="290" rx="20" fill="#090f22"/>
<ellipse cx="830" cy="147" rx="204" ry="135" fill="url(#halo)"/>
<rect x="1" y="1" width="1038" height="288" rx="19" fill="url(#grid)" stroke="#2d3e66"/>
<g fill="none" stroke="url(#accent)" opacity=".65" stroke-width="2">
  <ellipse cx="833" cy="144" rx="143" ry="48" transform="rotate(-24 833 144)"/>
  <ellipse cx="833" cy="144" rx="143" ry="48" transform="rotate(24 833 144)"/>
  <ellipse cx="833" cy="144" rx="143" ry="48" transform="rotate(70 833 144)"/>
  <circle class="trace" cx="833" cy="144" r="98" stroke-dasharray="8 10"/>
  <path d="M833 81l58 32v64l-58 32-58-32v-64z M775 113l58 32 58-32m-58 32v64"/>
</g>
<circle cx="833" cy="144" r="5" fill="#e0faff"/>
<path d="M54 58h62" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
<text x="54" y="123" fill="#f4f7ff" font-family="system-ui,sans-serif" font-weight="750" font-size="54">Udaya</text>
<text x="54" y="181" fill="#f4f7ff" font-family="system-ui,sans-serif" font-weight="750" font-size="54">Raghavendra</text>
<g fill="#8beaff" font-family="monospace" font-size="23">
  <text class="role-a" x="56" y="231">ASPIRING DATA ANALYST</text>
  <text class="role-b" x="56" y="231">MERN DEVELOPER</text>
  <text class="role-c" x="56" y="231">MACHINE LEARNING LEARNER</text>
</g>
</svg>
